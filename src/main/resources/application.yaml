spring:
  application:
    name: ai-novel-studio
  datasource:
    url: ${AI_NOVEL_DB_URL:jdbc:mysql://127.0.0.1:3306/ai_novel_studio?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${AI_NOVEL_DB_USERNAME:root}
    password: ${AI_NOVEL_DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: ai-novel-studio-pool
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: ${AI_NOVEL_REDIS_HOST:192.168.56.200}
      port: ${AI_NOVEL_REDIS_PORT:6379}
      password: ${AI_NOVEL_REDIS_PASSWORD:}
      database: ${AI_NOVEL_REDIS_DATABASE:0}
      timeout: ${AI_NOVEL_REDIS_TIMEOUT:2s}
  cache:
    type: redis

server:
  port: ${SERVER_PORT:8080}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

app:
  ai:
    # real 失败即报错；仅显式设置 mock 时使用 MockNovelAiClient。
    mode: ${AI_NOVEL_AI_MODE:real}
    enabled: true
  jobs:
    enabled: ${AI_NOVEL_JOBS_ENABLED:true}
    initial-delay-ms: ${AI_NOVEL_JOBS_INITIAL_DELAY_MS:30000}
    poll-interval-ms: ${AI_NOVEL_JOBS_POLL_INTERVAL_MS:1000}
    max-attempts: ${AI_NOVEL_JOBS_MAX_ATTEMPTS:3}
    retry-delay-ms: ${AI_NOVEL_JOBS_RETRY_DELAY_MS:30000}
    lease-timeout-ms: ${AI_NOVEL_JOBS_LEASE_TIMEOUT_MS:7200000}
    recovery-initial-delay-ms: ${AI_NOVEL_JOBS_RECOVERY_INITIAL_DELAY_MS:60000}
    recovery-interval-ms: ${AI_NOVEL_JOBS_RECOVERY_INTERVAL_MS:60000}
